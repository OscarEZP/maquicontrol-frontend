steps:
  # Paso 1: Instalar dependencias
  - name: node:20
    entrypoint: npm
    args: ["ci"]

  # Paso 2: Build Angular en modo producción
  - name: node:20
    entrypoint: npm
    args: ["run", "build"]

  # Paso 3: Copiar app.yaml a dist/browser (si no está ya allí)
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - "-c"
      - |
        cp app.yaml dist/Modernize/app.yaml

  # Paso 4: Desplegar a App Engine desde dist/browser
  - name: gcr.io/cloud-builders/gcloud
    dir: dist/Modernize
    args: ["app", "deploy", "app.yaml", "--quiet"]

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 900s  # 15 minutos
