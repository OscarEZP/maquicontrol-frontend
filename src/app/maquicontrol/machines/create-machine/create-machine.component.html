<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">
      {{ isEditMode ? 'Editar Máquina' : 'Crear Máquina' }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form [formGroup]="machineForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <!-- Categoría -->
        <div class="col-sm-6">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">Categoría</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select formControlName="id_categoria" placeholder="Seleccionar">
              <mat-option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Tipo de Activo -->
        <div class="col-sm-6">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">Tipo de Activo</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select formControlName="id_tipo" placeholder="Seleccionar">
              <mat-option *ngFor="let tipo of tiposFiltrados" [value]="tipo.id">{{ tipo.nombre }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Marca, Modelo, Serie, Parque, Matrícula, Tipo motor -->
        <ng-container *ngFor="let campo of ['marca','modelo','num_serie','num_parque','matricula']">
          <div class="col-sm-6">
            <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block m-t-12">{{ campo | titlecase }}</mat-label>
            <mat-form-field appearance="outline" class="w-100">
              <input matInput [formControlName]="campo" />
            </mat-form-field>
          </div>
        </ng-container>

        <div class="col-sm-6">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block m-t-12">Tipo de motor</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select formControlName="tipo_motor" placeholder="Seleccionar">
              <mat-option value="diesel">Diésel</mat-option>
              <mat-option value="electrico">Eléctrico</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Imagen -->
        <div class="col-sm-6 m-t-12">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">Imagen</mat-label>
          <div class="d-flex flex-column align-items-start gap-2">
            <div class="d-flex align-items-center gap-2">
              <input
                type="file"
                #fileInput
                hidden
                accept=".jpg,.jpeg,.png"
                (change)="onFileSelected($event)"
              />
              <button mat-flat-button color="primary" type="button" (click)="fileInput.click()">
                Seleccionar archivo
              </button>
              <span class="f-s-14" *ngIf="selectedFileName">{{ selectedFileName }}</span>
            </div>

            <!-- Vista previa -->
            <div *ngIf="imagePreview" class="m-t-8">
              <img [src]="imagePreview" alt="Previsualización" style="max-height: 200px; border-radius: 8px;" />
            </div>
          </div>
        </div>
      </div>

      <div class="text-end m-t-12">
        <button mat-flat-button color="primary" type="submit">
          {{ isEditMode ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>
    </form>

  </mat-card-content>
</mat-card>
