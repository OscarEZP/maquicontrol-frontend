<mat-card class="cardWithShadow m-b-24">
  <h2 class="mat-headline text-center">Imagen del Activo</h2>
  <mat-card-content>
    <!-- Imagen centrada -->
    <div class="d-flex justify-content-center m-b-16">
      <img
        *ngIf="imageUrl"
        [src]="imageUrl"
        alt="Imagen actual"
        class="img-fluid rounded shadow-sm"
        style="max-height: 200px;"
      />
    </div>

    <!-- Controles -->
    <div class="d-flex flex-column flex-md-row justify-content-center align-items-stretch gap-3 flex-wrap">

      <!-- Input invisible -->
      <input
        type="file"
        #fileInput
        accept=".jpg,.jpeg,.png"
        hidden
        (change)="onFileSelected($event)"
      />

      <!-- Mostrar nombre del archivo -->
      <mat-form-field appearance="outline" class="flex-grow-1 min-w-200px">
        <input matInput [value]="getFileName" readonly placeholder="Sin imagen seleccionada" />
      </mat-form-field>

      <!-- Botón para seleccionar imagen -->
      <button mat-stroked-button color="primary" style="margin-bottom: 14px;" type="button" (click)="fileInput.click()">
        Seleccionar Imagen
      </button>

      <!-- Botón para guardar imagen -->
      <button
        mat-flat-button
        color="accent"
        type="button"
        (click)="uploadOnlyImage()"
        [disabled]="!selectedFile"
      >
        Guardar Imagen
      </button>
    </div>
  </mat-card-content>
</mat-card>



<!-- FORMULARIO PRINCIPAL -->
<form [formGroup]="machineForm" (ngSubmit)="onSubmit()">
  <mat-card class="cardWithShadow">
    <mat-card-content>

      <h2 class="mat-headline">Editar Máquina</h2>

      <!-- CAMPOS GENERALES + SELECTORES -->
      <div class="row">
        <div class="col-sm-6" *ngFor="let field of generalFields">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">{{ field.label }} *</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput [formControlName]="field.name" />
          </mat-form-field>
        </div>

        <div class="col-sm-6">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">Categoría</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <mat-select formControlName="nombre_categoria">
              <mat-option *ngFor="let cat of categorias" [value]="cat.nombre">
                {{ cat.nombre }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="col-sm-6">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">Tipo Activo</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <mat-select formControlName="nombre_tipo">
              <mat-option *ngFor="let activo of tipoActivo" [value]="activo.nombre">
                {{ activo.nombre }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <!-- MOTOR ELÉCTRICO -->
      <div *ngIf="tipoMotor === 'electrico'" class="m-t-24">
        <mat-card class="border-left border-success">
          <mat-card-title>Información de Batería</mat-card-title>
          <div class="row">
            <div class="col-sm-6" *ngFor="let field of bateriaFields">
              <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">{{ field.label }} *</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput [formControlName]="field.name" />
              </mat-form-field>
            </div>
          </div>
        </mat-card>

        <mat-card class="m-t-16 border-left border-info">
          <mat-card-title>⚡ Información del Cargador</mat-card-title>
          <div class="row">
            <div class="col-sm-4" *ngFor="let field of cargadorFields">
              <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">{{ field.label }} *</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput [formControlName]="field.name" />
              </mat-form-field>
            </div>
          </div>
        </mat-card>
      </div>

      <!-- MOTOR DIÉSEL -->
      <div *ngIf="tipoMotor === 'diesel'" class="m-t-24">
        <mat-card class="border-left border-warning">
          <mat-card-title>Información del Motor Diésel</mat-card-title>
          <div class="row">
            <div class="col-sm-6" *ngFor="let field of dieselFields">
              <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">{{ field.label }} *</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput [formControlName]="field.name" />
              </mat-form-field>
            </div>
          </div>
        </mat-card>
      </div>

      <!-- GUARDAR -->
      <div class="m-t-24 text-end">
        <button mat-flat-button color="primary" type="submit">
          Guardar Cambios
        </button>
      </div>

    </mat-card-content>
  </mat-card>
</form>
